<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oguri Feeder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box-holder">
      <h1>Oguri Feeder</h1>
        <img src="3.png" id="feed-img" alt="Oguri Feeder">
        <p id="counter">Feeds: ...</p>
        <p class="text">This is a work in progress project made by</p>
        <p class="link">
            <a href="https://www.instagram.com/mdtowerz/" target="_blank">MDTOWERZ/The Climber</a>
        </p>    
    </div>


    <script>
// actual torture getting ts but it makes the clicks counter work, happy oguri?
        const KEY = "mdtowerz_oguri_feeder";
        const BASE = "https://countapi.mileshilliard.com/api/v1";
        const counterEl = document.getElementById("counter");
        const img = document.getElementById("feed-img");


        fetch(`${BASE}/get/${KEY}`)
            .then(res => res.json())
            .then(data => {
                counterEl.textContent = `Feeds: ${data.value ?? 0}`;
            })
            .catch(() => {
                counterEl.textContent = "Feeds: --";
            });


        img.addEventListener("click", (e) => {
            fetch(`${BASE}/hit/${KEY}`)
                .then(res => res.json())
                .then(data => {
                    counterEl.textContent = `Feeds: ${data.value}`;
                })
                .catch(() => {});

            // floating +1 effect
            const rect = img.parentElement.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const num = document.createElement("div");
            num.className = "float-number";
            num.textContent = "+1";
            num.style.left = `${x}px`;
            num.style.top = `${y}px`;

            img.parentElement.appendChild(num);
            num.addEventListener("animationend", () => num.remove());
        });
        document.addEventListener('touchstart', function(){}, false);
    </script>
</body>
</html>
